name: restore-prep-pango2
on:
  push:
    paths:
      - '.github/workflows/restore-prep-pango2.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore from live + verify
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/tenet-expert/tenet-expert.github.io/main/prepare_site_b.py -o prepare_site_b.py
          curl -fsSL https://raw.githubusercontent.com/tenet-expert/tenet-expert.github.io/main/patch_pango.py -o patch_pango.py
          grep -q 'const TERMS_DATE' prepare_site_b.py
          grep -q 't7a:{cash:2450000' patch_pango.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prepare_site_b.py patch_pango.py
          git commit -m "fix: prepare_site_b TERMS_DATE splice + patch_pango t7a from live" || echo nochange
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && break
            git rebase --abort 2>/dev/null || true
            sleep 3
          done
          # delete wf in same commit tree after push of restore
          git fetch origin main && git reset --hard origin/main
          rm -f .github/workflows/restore-prep-pango2.yml
          git add -A .github/workflows/restore-prep-pango2.yml
          if ! git diff --staged --quiet; then
            git commit -m "cleanup: remove restore-prep-pango2"
            git push origin HEAD:main || true
          fi
          # final verify tip still good
          git fetch origin main && git reset --hard origin/main
          grep -q 'const TERMS_DATE' prepare_site_b.py
          grep -q 't7a:{cash:2450000' patch_pango.py
          echo OK
