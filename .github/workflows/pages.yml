name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          python3 - <<'PY'
          from pathlib import Path
          parts = sorted(Path("parts").glob("p*.txt"))
          if parts:
              html = "".join(p.read_text() for p in parts)
          else:
              html = Path("TENET_T4L_netlify/index.html").read_text()
          patch = Path("study-fn.js")
          if patch.exists():
              extra = patch.read_text()
              a = html.find("    function study(){")
              b = html.find("    function brief(){")
              if extra.startswith("    function splitStudy") and a >= 0 and b > a:
                  html = html[:a] + extra + html[b:]
              elif a >= 0 and b > a:
                  html = html[:a] + extra + html[b:]
          css_path = Path("theme.css")
          if css_path.exists():
              css = css_path.read_text()
              a = html.find("<style>")
              b = html.find("</style>") + 8
              if a >= 0 and b > a:
                  html = html[:a] + "<style>\n" + css + "\n</style>" + html[b:]
          Path("_site/index.html").write_text(html)
          PY
          mkdir -p _site/cars
          if [ -d cars ]; then cp -f cars/*.jpg _site/cars/ 2>/dev/null || true; fi
          if [ -d TENET_T4L_netlify/cars ]; then cp -f TENET_T4L_netlify/cars/*.jpg _site/cars/ 2>/dev/null || true; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
