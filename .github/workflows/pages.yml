name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          python3 - <<'PY'
          from pathlib import Path
          parts = sorted(Path("parts").glob("p*.txt"))
          if parts:
              html = "".join(p.read_text() for p in parts)
          else:
              html = Path("TENET_T4L_netlify/index.html").read_text()
          html = html.replace(
              'let view = state.surname ? "home" : "login";',
              'let view = (state.surname && state.authed) ? "home" : "login";'
          )
          html = html.replace(
              'if(state.surname && userRun() && !done)',
              'if(state.authed && state.surname && userRun() && !done)'
          )
          html = html.replace(
              'stopTick(); state.surname=""; state.display=""; save();',
              'stopTick(); state.surname=""; state.display=""; state.authed=false; save();'
          )
          login = Path("login-fn.js")
          if login.exists():
              extra = login.read_text()
              a = html.find("    function login(){")
              b = html.find("    function homeLeadText(){")
              if a >= 0 and b > a:
                  html = html[:a] + extra + html[b:]
          ask = Path("ask-pin-fn.js")
          if ask.exists():
              extra = ask.read_text()
              if not extra.endswith("\n"):
                  extra += "\n"
              needle = '      const logout=document.getElementById("logout");'
              if needle in html:
                  html = html.replace(needle, extra + needle, 1)
              else:
                  print("askPin bind not found")
          old_login = '''const doLogin=document.getElementById("doLogin");\n      if(doLogin) doLogin.onclick=async()=>{\n        const v=(document.getElementById("surname").value||"").trim();\n        const err=document.getElementById("loginErr");\n        if(v.length<2){ err.textContent="Введите фамилию."; return; }\n        state.surname=norm(v); state.display=v.replace(/\\s+/g," "); save();\n        await refreshLocks();\n        if(userRun()){ resumeExam(userRun()); return; }\n        view="home"; render();\n      };'''
          new_login = '''const doLogin=document.getElementById("doLogin");\n      if(doLogin) doLogin.onclick=async()=>{\n        const v=(document.getElementById("surname").value||"").trim();\n        const pin=((document.getElementById("loginPin")||{}).value||"").trim();\n        const err=document.getElementById("loginErr");\n        if(v.length<2){ err.textContent="Введите фамилию."; return; }\n        if(!pin){ err.textContent="Введите личный код от РОП."; return; }\n        err.textContent="Проверяю код…";\n        await refreshLocks();\n        const rec=(remoteLocks||[]).find(x=>x && x.type==="login" && x.surname===norm(v));\n        if(!rec){ err.textContent="Код для этой фамилии ещё не выдан. Обратитесь к РОП."; return; }\n        if(String(rec.code||"").toUpperCase()!==pin.toUpperCase()){ err.textContent="Неверный код."; return; }\n        state.surname=norm(v); state.display=v.replace(/\\s+/g," "); state.authed=true; save();\n        if(userRun()){ resumeExam(userRun()); return; }\n        view="home"; render();\n      };'''
          if old_login in html:
              html = html.replace(old_login, new_login)
          else:
              print("doLogin block not found")
          patch = Path("study-fn.js")
          if patch.exists():
              extra = patch.read_text()
              a = html.find("    function study(){")
              b = html.find("    function brief(){")
              if a >= 0 and b > a:
                  html = html[:a] + extra + html[b:]
          unlock = Path("unlock-fn.js")
          if unlock.exists():
              extra = unlock.read_text()
              a = html.find("    function tryUnlock(code){")
              b = html.find("    function compactPaper(){")
              if a >= 0 and b > a:
                  html = html[:a] + extra + html[b:]
          css_path = Path("theme.css")
          if css_path.exists():
              css = css_path.read_text()
              a = html.find("<style>")
              b = html.find("</style>") + 8
              if a >= 0 and b > a:
                  html = html[:a] + "<style>\n" + css + "\n</style>" + html[b:]
          Path("_site/index.html").write_text(html)
          PY
          mkdir -p _site/cars
          if [ -d cars ]; then cp -f cars/*.jpg _site/cars/ 2>/dev/null || true; fi
          if [ -d TENET_T4L_netlify/cars ]; then cp -f TENET_T4L_netlify/cars/*.jpg _site/cars/ 2>/dev/null || true; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
