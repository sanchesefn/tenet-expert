name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          if [ -f prepare_site_a.py ] && [ -f prepare_site_b.py ]; then
            cat prepare_site_a.py prepare_site_b.py > prepare_site.py
          fi
          if [ -f terms-calc-data.js ] && [ -f terms-calc-ui-a.js ] && [ -f terms-calc-ui-b.js ]; then
            cat terms-calc-data.js terms-calc-loan.js terms-mpt.js terms-calc-ui-a.js terms-calc-ui-b.js > terms-calc-fn.js
          fi
          python3 prepare_site.py
          if [ -f patch_mpt.py ]; then python3 patch_mpt.py; fi
          if [ -f patch_css.py ]; then python3 patch_css.py; fi
          mkdir -p _site/cars _site/docs/prices _site/hub
          if [ -d cars ]; then cp -f cars/*.jpg _site/cars/ 2>/dev/null || true; fi
          if [ -d TENET_T4L_netlify/cars ]; then cp -f TENET_T4L_netlify/cars/*.jpg _site/cars/ 2>/dev/null || true; fi
          if [ -d hub ]; then cp -f hub/*.jpg _site/hub/ 2>/dev/null || true; fi
          if [ -d TENET_T4L_netlify/hub ]; then cp -f TENET_T4L_netlify/hub/*.jpg _site/hub/ 2>/dev/null || true; fi
          if [ -d docs ]; then
            cp -f docs/*.pdf docs/*.html _site/docs/ 2>/dev/null || true
            if [ -d docs/prices ]; then cp -f docs/prices/* _site/docs/prices/ 2>/dev/null || true; fi
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
