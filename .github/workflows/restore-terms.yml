name: restore-terms-calc-data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bump TERMS_DATE to 02.10.2026
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("terms-calc-data.js")
          t = p.read_text(encoding="utf-8")
          t2 = t.replace('const TERMS_DATE = "01.10.2026"', 'const TERMS_DATE = "02.10.2026"', 1)
          if t2 == t:
              raise SystemExit("TERMS_DATE replace failed — already 02.10.2026 or unexpected content")
          if "PLACEHOLDER" in t2 or "LOAD_FROM_FILE" in t2 or "$file:" in t2:
              raise SystemExit("stub markers detected")
          if "KM_BANK_RATES" not in t2 or "t4l_t7" not in t2:
              raise SystemExit("KM_BANK_RATES empty/missing")
          if "const KM_BANK_MONTHS" not in t2:
              raise SystemExit("KM_BANK_MONTHS missing")
          p.write_text(t2, encoding="utf-8")
          print("bytes", p.stat().st_size)
          PY
          node --check terms-calc-data.js
          test "$(wc -c < terms-calc-data.js)" -gt 15000
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terms-calc-data.js
          git commit -m "terms: sync 02.10.2026 from sheet"
          git push origin HEAD:main
