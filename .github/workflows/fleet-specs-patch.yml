name: fleet-specs-patch
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fleet-specs-patch.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path("terms-fleet.js")
          t = p.read_text(encoding="utf-8")
          old = 'ta8p:{name:"A8 Prime 1.6",rrc:2999000,dealer:2874000,an:400000,client:2639120,prem:294860,km:16279,tidy:2599000,sub:0,do:70000,casco:80000}'
          new = 'ta8p:{name:"A8 Prime 1.6",rrc:2999000,dealer:2874000,an:400000,client:2639120,prem:294860,km:16279,tidy:2599000,sub:150000,do:70000,casco:80000}'
          if old not in t:
              raise SystemExit("ta8p old missing in fleet")
          p.write_text(t.replace(old, new, 1), encoding="utf-8")
          print("fleet", p.stat().st_size)
          fn = Path("terms-calc-fn.js")
          t = fn.read_text(encoding="utf-8")
          t, n = re.subn(r'const TERMS_DATE = "[^"]+";', 'const TERMS_DATE = "02.10.2026";', t, count=1)
          print("date", n)
          new_inv = (
              'const TERMS_INV = [\n'
              '      {model:"T4L",trim:"Active",price:"2 150 нал, 2 100 ТИ"},\n'
              '      {model:"T4L",trim:"Prime",price:"2 250 нал, 2 200 ТИ"},\n'
              '      {model:"T7",trim:"Active 2WD",price:"2 450 нал, 2 350 ТИ"},\n'
              '      {model:"T7",trim:"Prime 2WD",price:"2 550 нал, 2 450 ТИ"},\n'
              '      {model:"T8",trim:"Prime 4WD",price:"3 100 нал, 3 000 ТИ"},\n'
              '      {model:"T8",trim:"Ultra 4WD",price:"3 300 нал, 3 200 ТИ"}\n'
              '    ];'
          )
          t, n = re.subn(r'const TERMS_INV = \[[\s\S]*?\];', new_inv, t, count=1)
          print("inv", n)
          new_pango = (
              'const PANGO_FIX = {\n'
              '      t4la:{cash:2150000,ti:2100000},\n'
              '      t4lp:{cash:2250000,ti:2200000},\n'
              '      t7a:{cash:2450000,ti:2350000},\n'
              '      t7p:{cash:2550000,ti:2450000},\n'
              '      t8p4:{cash:3100000,ti:3000000},\n'
              '      t8u4:{cash:3300000,ti:3200000}\n'
              '    };'
          )
          t, n = re.subn(r'const PANGO_FIX = \{[\s\S]*?\n    \};', new_pango, t, count=1)
          print("pango", n)
          if old in t:
              t = t.replace(old, new, 1)
              print("fn ta8p patched")
          fn.write_text(t, encoding="utf-8")
          print("fn", fn.stat().st_size)
          PY
          node --check terms-fleet.js
          node --check terms-calc-fn.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terms-fleet.js terms-calc-fn.js
          git commit -m "флит/спецы: ta8p sub 150000; PANGO/TERMS_INV T7 Active 2WD в terms-calc-fn" || echo "no changes"
          git push origin HEAD:main
      - name: Cleanup
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          if [ -f .github/workflows/fleet-specs-patch.yml ]; then
            git rm -f .github/workflows/fleet-specs-patch.yml
            git commit -m "cleanup: remove fleet-specs-patch workflow" || exit 0
            git push origin HEAD:main || true
          fi
