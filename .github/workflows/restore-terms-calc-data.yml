name: restore-terms-calc-data
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore full terms-calc-data.js and set TERMS_DATE 03.10.2026
        run: |
          set -euo pipefail
          # Good file at parent of accidental stub (TERMS_DATE 02.10.2026, ~22159 bytes)
          git show bcb8b5415ace8f2da139e2d2abcbda7bafc5d520:terms-calc-data.js > terms-calc-data.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("terms-calc-data.js")
          t = p.read_text(encoding="utf-8")
          t2 = t.replace('const TERMS_DATE = "02.10.2026"', 'const TERMS_DATE = "03.10.2026"', 1)
          if t2 == t:
              raise SystemExit("TERMS_DATE replace failed")
          for bad in ("PLACEHOLDER", "LOAD_FROM_FILE", "LOAD_FROM_WORKSPACE_FILE", "$file:", "FILE:/"):
              if bad in t2:
                  raise SystemExit(f"stub marker detected: {bad}")
          if "KM_BANK_RATES" not in t2 or "t4l_t7" not in t2:
              raise SystemExit("KM_BANK_RATES empty/missing")
          if "const KM_BANK_MONTHS" not in t2 or "};" not in t2[t2.index("const KM_BANK_MONTHS"):t2.index("const KM_BANK_MONTHS")+500]:
              raise SystemExit("KM_BANK_MONTHS malformed")
          p.write_text(t2, encoding="utf-8")
          print("bytes", p.stat().st_size)
          PY
          node --check terms-calc-data.js
          test "$(wc -c < terms-calc-data.js)" -gt 15000
          echo "blob $(git hash-object terms-calc-data.js)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add terms-calc-data.js
          git commit -m "sync terms 03.10.2026 (restore full after accidental stub)"
          git push origin HEAD:main
      - name: Cleanup workflow file
        if: always()
        run: |
          set -euo pipefail
          if [ -f .github/workflows/restore-terms-calc-data.yml ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -f .github/workflows/restore-terms-calc-data.yml
            git commit -m "cleanup: remove restore-terms-calc-data workflow" || exit 0
            git push origin HEAD:main
          fi
